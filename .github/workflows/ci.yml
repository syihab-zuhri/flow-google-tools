name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Install system dependencies for Tauri and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Rust security audit
        run: cargo audit

      - name: Export and check typed IPC bindings
        run: |
          cargo run -p flow-studio --bin export-bindings
          git diff --exit-code src/bindings.ts

      - name: Frontend quality suite
        run: pnpm quality

      - name: Frontend production build
        run: pnpm build

      - name: Storybook static build
        run: pnpm build-storybook
